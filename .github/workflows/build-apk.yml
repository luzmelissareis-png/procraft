          echo "signing key (certificate SHA-256): $got"
          test "$got" = "$EXPECTED_CERT_SHA256"
          # the build is given it the way the project's own release workflow gives its key (android/app/build.gradle.kts):
          # a build left to find "the debug key" on its own made a new one, wherever it looked
