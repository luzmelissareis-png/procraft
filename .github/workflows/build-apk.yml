      - id: v
        name: Version
        run: |
          v="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          test -n "$v"
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### ProCraft $v: $VARIANT build ($BUILD_LABEL) of upstream ${UPSTREAM_COMMIT::7} with the patches" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: apk-fix

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version "^4" --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Sign with the key every build of this app uses
        run: |
          set -eu
          # Android installs an APK over an app only if both are signed with the same key. A key made afresh on each
          # run would make every APK a stranger to the last: to install it, the last would have to be uninstalled
          # first, and its artwork with it. So the key travels inside this file. It is a "debug" key, of the kind
          # that isn't secret: fine for a build of your own, not for one published for others.
          mkdir -p "$HOME/.android"
          tr -d '\r' <<'EOF' | base64 -d >"$HOME/.android/debug.keystore"
