          set -eu
          # Android installs an APK over an app only if both are signed with the same key. A key made afresh on each
          # run would make every APK a stranger to the last: to install it, the last would have to be uninstalled
          # first, and its artwork with it. So the key travels inside this file. It is a "debug" key, of the kind
          # that isn't secret: fine for a build of your own, not for one published for others.
