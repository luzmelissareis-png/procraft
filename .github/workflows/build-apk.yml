      - id: v
        name: Version
        run: |
          v="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          test -n "$v"
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### ProCraft $v: $VARIANT build ($BUILD_LABEL) of upstream ${UPSTREAM_COMMIT::7} with the patches" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: apk-fix

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version "^4" --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -o pipefail
          task=":app:assemble${VARIANT^}"
          echo "gradle task: $task"
          ./gradlew --no-daemon "$task" -Pprocraft.abis=arm64-v8a "-Pprocraft.version=$VERSION" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Check and name the APK
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          apk="android/app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
          ls -l "$apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          pkg="$("${tools}aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          echo "app id: $pkg"
          case "$pkg" in
            io.github.artcraftandroid.procraft.fix | io.github.artcraftandroid.procraft.debug.fix) ;;
            *) echo "::error::unexpected app id '$pkg': the side-by-side patch did not apply"; exit 1 ;;
          esac
          suffix=""
          if [ "$VARIANT" = debug ]; then suffix="-debug"; fi
          mkdir -p dist
          out="dist/ProCraft-fix-$VERSION-$BUILD_LABEL-arm64$suffix.apk"
          cp "$apk" "$out"
          "${tools}apksigner" verify --print-certs "$out" | sed -n '1,4p'
          (cd dist && sha256sum -- *.apk | tee SHA256SUMS.txt)
          {
            echo
            echo "App id: \`$pkg\`"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ProCraft-fix-apk
          path: dist/*
          if-no-files-found: error

      - name: Release (so the APK can be downloaded straight onto the phone)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          tag="fix-build-$GITHUB_RUN_NUMBER-$VARIANT"
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
            --title "ProCraft fix $VERSION ($VARIANT build $GITHUB_RUN_NUMBER)" \
            --notes "Tap the .apk below on your phone to download it, then open it to install. It appears as ProCraft fix next to your ProCraft. Built from upstream ProCraft ${UPSTREAM_COMMIT::7} with the memory fixes and the Procreate brush-import reports ($BUILD_LABEL); signed with a throwaway debug key." \
            dist/*

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
