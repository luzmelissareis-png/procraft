# Builds the ProCraft Android app (64-bit ARM: the Galaxy S24 FE and nearly every phone) with the
# memory fixes, on GitHub's servers, and puts the APK under "Releases" so it can be downloaded
# straight onto the phone.
#
#   upstream ProCraft commit 7f73ab1 (the code the last APK was built from)
#   + the GPU memory fix + the photo-import fix   (two patches, inside this file)
#   + its own app id, "ProCraft fix": it installs NEXT TO the ProCraft already on the phone;
#     nothing is replaced, no artwork is touched
#
# This is the only file needed: put it at .github/workflows/build-apk.yml in any GitHub repository.
#
# Run it: Actions > "Build ProCraft APK" > Run workflow. About 30 to 45 minutes.
name: Build ProCraft APK

on:
  # pushing the branch "fix-apk-build" builds the release APK; "fix-apk-build-debug" the debug one
  push:
    branches: [fix-apk-build, fix-apk-build-debug]
  workflow_dispatch:
    inputs:
      variant:
        description: "release (the default). debug only if release fails."
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"
  UPSTREAM_COMMIT: 7f73ab17fabe2b4a536a564c1dbdc702833ee407
  VARIANT: ${{ inputs.variant || (endsWith(github.ref_name, '-debug') && 'debug' || 'release') }}

jobs:
  apk:
    name: APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: ProCraft's source, exactly as the last APK was built
        uses: actions/checkout@v4
        with:
          repository: artcraft-android/procraft
          ref: ${{ env.UPSTREAM_COMMIT }}

      - name: Apply the patches
        run: |
          set -eu
          # the two patches travel inside this file (compressed), so nothing else has to be uploaded
          d="$RUNNER_TEMP/patches"; mkdir -p "$d"
          tr -d '\r' <<'EOF' | base64 -d | gunzip >"$d/1-memory-fix-and-photo-import.patch"
