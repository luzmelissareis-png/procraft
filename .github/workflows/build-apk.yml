          got="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "signing key (certificate SHA-256): $got"
          test "$got" = "$EXPECTED_CERT_SHA256"

      - name: Build
        working-directory: android
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -o pipefail
          task=":app:assemble${VARIANT^}"
          echo "gradle task: $task"
          ./gradlew --no-daemon "$task" -Pprocraft.abis=arm64-v8a "-Pprocraft.version=$VERSION" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Check and name the APK
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          apk="android/app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
          ls -l "$apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          pkg="$("${tools}aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          echo "app id: $pkg"
          case "$pkg" in
            io.github.artcraftandroid.procraft.fix2 | io.github.artcraftandroid.procraft.debug.fix2) ;;
            *) echo "::error::unexpected app id '$pkg': the side-by-side patch did not apply"; exit 1 ;;
          esac
          suffix=""
          if [ "$VARIANT" = debug ]; then suffix="-debug"; fi
          mkdir -p dist
          out="dist/ProCraft-fix-$VERSION-$BUILD_LABEL-arm64$suffix.apk"
          cp "$apk" "$out"
          certs="$("${tools}apksigner" verify --print-certs "$out")"
          echo "$certs" | sed -n '1,4p'
          # the key every build of this app is signed with: another, and this APK could not update the last
          echo "$certs" | grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" || { echo "::error::the APK is not signed with the fixed key"; exit 1; }
          (cd dist && sha256sum -- *.apk | tee SHA256SUMS.txt)
          {
            echo
            echo "App id: \`$pkg\`"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ProCraft-fix-apk
          path: dist/*
          if-no-files-found: error

      - name: Release (so the APK can be downloaded straight onto the phone)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          tag="fix-build-$GITHUB_RUN_NUMBER-$VARIANT"
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
            --title "ProCraft fix $VERSION ($VARIANT build $GITHUB_RUN_NUMBER)" \
            --notes "Tap the .apk below on your phone to download it, then open it to install. It appears as ProCraft fix 2, next to your ProCraft. Every later build signed with this same key installs over it as an update. Built from upstream ProCraft ${UPSTREAM_COMMIT::7} with the memory fixes, the Procreate brush-import reports and the big-canvas memory bounds ($BUILD_LABEL); signed with a fixed debug key (certificate SHA-256 $EXPECTED_CERT_SHA256)." \
            dist/*

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
